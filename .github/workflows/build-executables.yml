name: Build Executables and Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Executable and Installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg fakeroot
    
    - name: Build Linux executable
      run: |
        chmod +x build-linux.sh
        ./build-linux.sh
    
    - name: Create tarball
      run: |
        cd dist
        tar -czf ../jukebox-linux-x64.tar.gz jukebox
        cd ..
        cp env.example dist/
    
    - name: Build Linux installer (.deb)
      run: |
        chmod +x build-linux-installer.sh
        ./build-linux-installer.sh
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jukebox-linux-x64
        path: |
          jukebox-linux-x64.tar.gz
          installers/jukebox-pi-money_2.3.0_amd64.deb
          dist/env.example
          QUICKSTART_EXECUTABLE.md
          INSTALLER.md
  
  build-windows:
    name: Build Windows Executable and Installer
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        
    - name: Build Windows executable
      run: |
        build-windows.bat
    
    - name: Create zip
      run: |
        cd dist
        Compress-Archive -Path jukebox.exe -DestinationPath ../jukebox-windows-x64.zip
        cd ..
        Copy-Item env.example dist/
    
    - name: Build Windows installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-windows.iss
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jukebox-windows-x64
        path: |
          jukebox-windows-x64.zip
          installers/jukebox-setup-windows-x64.exe
          dist/env.example
          QUICKSTART_EXECUTABLE.md
          INSTALLER.md
  
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: jukebox-linux-x64
        path: artifacts-linux
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: jukebox-windows-x64
        path: artifacts-windows
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts-linux/jukebox-linux-x64.tar.gz
          artifacts-linux/jukebox-pi-money_2.3.0_amd64.deb
          artifacts-windows/jukebox-windows-x64.zip
          artifacts-windows/jukebox-setup-windows-x64.exe
          artifacts-linux/env.example
          artifacts-linux/QUICKSTART_EXECUTABLE.md
          artifacts-linux/INSTALLER.md
        body: |
          ## 🎵 Jukebox Pi Money - Release v2.3.0
          
          Sistema embarcado de Jukebox com aceitador de notas e YouTube Music.
          
          ### 📦 Downloads Disponíveis
          
          #### 🐧 Linux (x86_64)
          
          **Opção 1: Instalador Debian (.deb)** - ⭐ Recomendado
          - **jukebox-pi-money_2.3.0_amd64.deb** - Instalador para Ubuntu/Debian
          - Instalação profissional com um comando
          - Cria atalhos automaticamente
          - Configuração automática
          - Fácil de desinstalar
          
          **Opção 2: Executável Standalone (.tar.gz)**
          - **jukebox-linux-x64.tar.gz** - Executável portátil
          - Não requer instalação
          - Bom para testes rápidos
          
          #### 🪟 Windows (x86_64)
          
          **Opção 1: Instalador (.exe)** - ⭐ Recomendado
          - **jukebox-setup-windows-x64.exe** - Instalador para Windows
          - Interface gráfica de instalação
          - Cria atalhos no Desktop e Menu Iniciar
          - Configuração guiada
          - Desinstalação pelo Painel de Controle
          
          **Opção 2: Executável Standalone (.zip)**
          - **jukebox-windows-x64.zip** - Executável portátil
          - Não requer instalação
          - Bom para testes rápidos
          
          ### 🚀 Como usar
          
          #### Com Instalador (Recomendado)
          
          **Linux:**
          ```bash
          sudo dpkg -i jukebox-pi-money_2.3.0_amd64.deb
          sudo nano /etc/jukebox/.env  # Configure
          jukebox  # Execute
          ```
          
          **Windows:**
          1. Execute `jukebox-setup-windows-x64.exe`
          2. Siga o assistente de instalação
          3. Use o atalho criado no Desktop
          
          #### Com Executável Standalone
          
          1. Baixe o arquivo para sua plataforma
          2. Extraia o arquivo
          3. Copie o `env.example` para `.env` e configure
          4. Execute o jukebox
          5. Acesse http://localhost:5000
          
          ### 📖 Documentação Completa
          
          - **INSTALLER.md** - Guia completo de instaladores (incluído no download)
          - **QUICKSTART_EXECUTABLE.md** - Guia rápido para executáveis
          - **env.example** - Exemplo de configuração
          - [README.md](https://github.com/godfathercorleone994-wq/Jukebox/blob/main/README.md) - Documentação principal
          - [BUILD.md](https://github.com/godfathercorleone994-wq/Jukebox/blob/main/BUILD.md) - Como construir
          - [API.md](https://github.com/godfathercorleone994-wq/Jukebox/blob/main/API.md) - Documentação da API
          
          ### ✨ Características
          
          - 💰 Múltiplos métodos de pagamento (Dinheiro, PIX, Débito, Crédito)
          - 🎵 Reproduz músicas do YouTube automaticamente
          - 🎧 Música ambiente automática quando em espera
          - 🚫 Bloqueio de anúncios integrado
          - ⌨️ Navegação completa por teclado
          - 🔐 Sistema de código de operador
          - 📱 Interface web responsiva e moderna
          
          ### 🌐 Testar Online (Sem Instalar)
          
          Prefere testar sem instalar nada?
          Acesse a demo online: https://godfathercorleone994-wq.github.io/Jukebox/
          
          ### 🆘 Suporte
          
          - 📧 Email: godfathercorleone994@gmail.com
          - 🐛 Issues: https://github.com/godfathercorleone994-wq/Jukebox/issues
          - 📖 Docs: https://github.com/godfathercorleone994-wq/Jukebox
          
          ---
          
          **Desenvolvido com ❤️ para a comunidade**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

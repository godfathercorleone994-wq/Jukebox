name: Deploy to GitHub Pages

# Permite executar manualmente ou em push para main/master
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Define permissões para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma implantação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job de build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Preparar arquivos para GitHub Pages
        run: |
          mkdir -p _site
          
          # Copiar o index.html demo do web/
          cp web/index.html _site/demo.html
          
          # Copiar arquivos estáticos (JS)
          mkdir -p _site/static/js
          cp static/js/youtube-player.js _site/static/js/
          
          # Criar uma página index.html principal que lista as demos disponíveis
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Jukebox - Demos e Testes</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      padding: 20px;
                  }
                  
                  .container {
                      background: white;
                      border-radius: 12px;
                      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                      padding: 40px;
                      max-width: 700px;
                      width: 100%;
                  }
                  
                  h1 {
                      color: #333;
                      margin-bottom: 10px;
                      font-size: 32px;
                      text-align: center;
                  }
                  
                  .subtitle {
                      color: #666;
                      margin-bottom: 30px;
                      font-size: 16px;
                      text-align: center;
                  }
                  
                  .demo-list {
                      list-style: none;
                  }
                  
                  .demo-item {
                      margin-bottom: 15px;
                  }
                  
                  .demo-link {
                      display: block;
                      padding: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      text-decoration: none;
                      border-radius: 8px;
                      transition: all 0.3s;
                      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                  }
                  
                  .demo-link:hover {
                      transform: translateY(-2px);
                      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
                  }
                  
                  .demo-title {
                      font-size: 18px;
                      font-weight: 600;
                      margin-bottom: 5px;
                  }
                  
                  .demo-description {
                      font-size: 14px;
                      opacity: 0.9;
                  }
                  
                  .info-box {
                      background: #f9fafb;
                      padding: 20px;
                      border-radius: 8px;
                      margin-top: 30px;
                      border-left: 4px solid #667eea;
                  }
                  
                  .info-box h3 {
                      font-size: 16px;
                      color: #333;
                      margin-bottom: 10px;
                  }
                  
                  .info-box p {
                      font-size: 14px;
                      color: #666;
                      line-height: 1.6;
                      margin-bottom: 10px;
                  }
                  
                  .info-box a {
                      color: #667eea;
                      text-decoration: none;
                      font-weight: 600;
                  }
                  
                  .info-box a:hover {
                      text-decoration: underline;
                  }
                  
                  .badge {
                      display: inline-block;
                      background: #10b981;
                      color: white;
                      padding: 4px 12px;
                      border-radius: 12px;
                      font-size: 12px;
                      font-weight: 600;
                      margin-left: 10px;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🎵 Jukebox</h1>
                  <p class="subtitle">Demos e Testes no Navegador <span class="badge">GitHub Pages</span></p>
                  
                  <ul class="demo-list">
                      <li class="demo-item">
                          <a href="demo.html" class="demo-link">
                              <div class="demo-title">🎵 YouTube Player Demo</div>
                              <div class="demo-description">Teste o player de YouTube com IFrame API - reprodução apenas de áudio</div>
                          </a>
                      </li>
                  </ul>
                  
                  <div class="info-box">
                      <h3>ℹ️ Sobre este ambiente de testes</h3>
                      <p>
                          Esta página é automaticamente implantada via <strong>GitHub Actions</strong> 
                          e hospedada no <strong>GitHub Pages</strong>. Você pode testar os componentes 
                          frontend do Jukebox diretamente no navegador sem precisar instalar nada localmente.
                      </p>
                      <p>
                          <strong>Nota:</strong> Esta é apenas a interface de demonstração. 
                          Para o sistema completo com backend Flask, hardware GPIO e pagamentos, 
                          consulte o <a href="https://github.com/godfathercorleone994-wq/Jukebox" target="_blank">repositório no GitHub</a>.
                      </p>
                  </div>
              </div>
          </body>
          </html>
          EOF
          
          echo "Estrutura de arquivos criada:"
          ls -la _site/
          find _site/ -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Job de deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

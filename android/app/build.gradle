apply plugin: 'com.android.application'

android {
    namespace 'com.jukebox.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.jukebox.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No AndroidX dependencies required for basic WebView functionality
    // This keeps the APK size small and build simple
    // Add implementation 'androidx.appcompat:appcompat:1.6.1' if you need AppCompat features
}
